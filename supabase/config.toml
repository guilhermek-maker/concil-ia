# Configuração usada pelo Supabase CLI (deploy pelo GitHub Actions).
project_id = "concil-ia"

[functions.ai-assistant]
verify_jwt = true

# Valida o usuário por conta própria (JWT) ou pelo CRON_SECRET na sincronização agendada.
[functions.integrations]
verify_jwt = false

# Retorno do OAuth das plataformas: público, protegido pelo "state" assinado.
[functions.oauth-callback]
verify_jwt = false

[auth]
site_url = "https://ecombalance.com.br/"
# Cadastro fechado: só quem já tem conta entra. Para incluir alguém da equipe, mude para true, rode `supabase config push`, e volte para false depois.
enable_signup = false
additional_redirect_urls = ["https://ecombalance.com.br/**", "https://www.ecombalance.com.br/**", "https://guilhermek-maker.github.io/ecombalance/**", "https://guilhermek-maker.github.io/fechai/**", "https://guilhermek-maker.github.io/concil-ia/**", "http://127.0.0.1:3000/**"]
