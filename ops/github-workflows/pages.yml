name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar config.js a partir das variáveis do repositório
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site && cp -r web/. _site/
          node -e "const u=process.env.SUPABASE_URL||'',k=process.env.SUPABASE_ANON_KEY||'';require('fs').writeFileSync('_site/config.js','window.CONCILIA_CONFIG = '+JSON.stringify({supabaseUrl:u,supabaseAnonKey:k})+';\n')"
          echo "Modo: $([ -n "$SUPABASE_URL" ] && echo nuvem || echo local)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
