name: Verificação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe do site
        run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos das Edge Functions
        working-directory: supabase/functions
        run: deno check */index.ts
