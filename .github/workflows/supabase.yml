name: Publicar banco e funções (Supabase)

# Roda quando algo em supabase/ muda, ou manualmente (Actions › Publicar banco e funções › Run workflow).
# Só age depois que os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD e a variável
# SUPABASE_PROJECT_REF forem cadastrados no repositório (docs/CONFIGURAR.md).
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase ainda não configurado — nada a publicar. Veja docs/CONFIGURAR.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - name: Vincular projeto
        if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrações do banco
        if: steps.cfg.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Enviar segredos das funções
        if: steps.cfg.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_EFFORT: ${{ vars.AI_EFFORT }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          MAGALU_CLIENT_ID: ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET: ${{ secrets.MAGALU_CLIENT_SECRET }}
        run: |
          : > .secrets.env
          for name in ANTHROPIC_API_KEY AI_MODEL AI_EFFORT AI_DAILY_LIMIT OAUTH_STATE_SECRET CRON_SECRET \
                      BLING_CLIENT_ID BLING_CLIENT_SECRET ML_CLIENT_ID ML_CLIENT_SECRET \
                      SHOPEE_PARTNER_ID SHOPEE_PARTNER_KEY MAGALU_CLIENT_ID MAGALU_CLIENT_SECRET; do
            value="${!name}"
            [ -n "$value" ] && printf '%s=%s\n' "$name" "$value" >> .secrets.env
          done
          # Sem OAUTH_STATE_SECRET cadastrado, gera um a cada publicação (só invalida conexões em andamento).
          grep -q '^OAUTH_STATE_SECRET=' .secrets.env || echo "OAUTH_STATE_SECRET=$(openssl rand -hex 32)" >> .secrets.env
          supabase secrets set --project-ref "$PROJECT_REF" --env-file .secrets.env
          rm -f .secrets.env
      - name: Publicar Edge Functions
        if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
